[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2", "cmake"]
build-backend = "setuptools.build_meta"

[project]
name = "leidenalg_pop"
authors = [
    {name = "V.A. Traag", email = "vincent@traag.net"},
]
description = "Leiden is a general algorithm for methods of community detection in large networks."
readme = "README.rst"
requires-python = ">=3.7"
keywords=[
    "graph",
    "network",
    "community detection",
    "clustering"
    ]
license = "GPL-3.0-or-later"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Programming Language :: Python",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Sociology"
]
dependencies = [
    "igraph >= 1.0.0,< 2.0",
]
dynamic = ["version"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/leidenalg_pop/version.py"
